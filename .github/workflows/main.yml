name: Open-Shell

on:
  workflow_dispatch:
    branches: [ master ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        compiler: ["msvc2022"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Visual Studio ATL Component
        shell: powershell
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart" -Wait

      - name: Build installers
        shell: cmd
        working-directory: ${{github.workspace}}
        env:
          CS_VERSION: "4.4.1000"
        run: Src\Setup\__MakeFinal.bat

      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-${{matrix.compiler}}
          path: |
            Src/Setup/Final/*.exe
          retention-days: 7
